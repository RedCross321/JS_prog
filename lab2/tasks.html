<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="phone-container">
        <div class="task-list">
            <div class="task-item">
                <div class="task-status pending"></div>
                <span class="task-text">Create new project</span>
                <div class="task-actions">
                    <a href="addTask.html" class="icon-button edit">✎</a>
                    <span class="icon-button delete">✕</span>
                </div>
            </div>
            <div class="task-item">
                <div class="task-status completed">✓</div>
                <span class="task-text completed-text">Create new project</span>
                <div class="task-actions">
                    <a href="addTask.html" class="icon-button edit">✎</a>
                    <span class="icon-button delete">✕</span>
                </div>
            </div>
        </div>
        <a href="addTask.html" class="fab-button">+</a>
    </div>
</body>
</html>
